{% extends "base.html" %}

{% block title %}Login - Bean & Brew{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="card p-4 shadow" style="max-width: 400px; width: 100%; border-radius: 10px;">
        <h2 class="text-center mb-4">Login</h2>
        <form method="POST" action="{{ url_for('login') }}">
            <!-- Username -->
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
            </div>

            <!-- Submit -->
            <div class="d-grid">
                <button type="submit" class="btn" style="background-color: #4a7c59; color: white;">Login</button>
            </div>

            <!-- Optional Register Link -->
            <p class="text-center mt-3">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>

        </form>
    </div>
</div>
{% endblock %}
