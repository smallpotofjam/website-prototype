{% extends 'base.html' %}

{% block content %}

<style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #222;
      color: #fff;
    }

    #play-area {
      position: relative;
      width: 1000px;
      height: 700px;
      border: 3px solid #444;
      overflow: hidden;
      margin-bottom: 20px;
      background-image: url("{{ url_for('static', filename='background.jpg') }}");
      background-size: cover;
      background-position: center;
    }

    .wacky {
      position: absolute;
      width: 150px;
      height: auto;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      transition: transform 0.4s ease, left 0.4s ease, top 0.4s ease;
      cursor: pointer;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #ff6a00;
      color: #fff;
    }

    button:hover {
      background: #ff8c33;
    }
</style>

<div id="play-area">
    <img class="wacky" src="{{ url_for('static', filename='wacky1.png') }}">
    <img class="wacky" src="{{ url_for('static', filename='wacky2.png') }}">
    <img class="wacky" src="{{ url_for('static', filename='wacky3.png') }}">
</div>

<button id="toggle-btn">Pause Wackiness</button>

<script src="{{ url_for('static', filename='wacky.js') }}"></script>

{% endblock %}
