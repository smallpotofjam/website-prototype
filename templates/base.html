<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bean & Brew{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- ✅ NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid position-relative d-flex align-items-center justify-content-between">

    <!-- LEFT SIDE -->
    <div class="d-flex align-items-center">
        <a href="{{ url_for('home') }}" class="navbar-brand logo-left">
            <img src="{{ url_for('static', filename='logo2.png') }}" alt="Logo 2">
        </a>

        <ul class="navbar-nav d-flex flex-row ms-2">
            <li class="nav-item me-3">
                <a class="nav-link" href="{{ url_for('home') }}">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
            </li>
        </ul>
    </div>

    <!-- CENTER LOGO -->
    <a href="{{ url_for('home') }}" class="navbar-brand logo-center">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
    </a>

    <!-- RIGHT SIDE -->
    <ul class="navbar-nav d-flex flex-row">
        <li class="nav-item me-3">
            <a class="nav-link" href="{{ url_for('coffee_page') }}">Shop</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{{ url_for('aarongame') }}">Game</a>
        </li>
    </ul>

</div>
</nav>

<!-- ✅ PAGE CONTENT -->
<main >
    {% block content %}{% endblock %}
</main>

<!-- ✅ FOOTER -->
<footer class="text-center mt-5 mb-3">
    <p>&copy; {{ current_year }} Bean & Brew. All Rights Reserved.</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">


</script>

</body>
</html>
