{% extends "base.html" %}

{% block content %}

<div class="container-fluid p-0 position-relative hero-section">
    <div class="row g-0">

        <div class="col-6">
            <img src="{{ url_for('static', filename='images/sunrise.png') }}"
                 class="img-fluid w-100 hero-img"
                 alt="Image 1">
        </div>

        <div class="col-6">
            <img src="{{ url_for('static', filename='images/produce.png') }}"
                 class="img-fluid w-100 hero-img"
                 alt="Image 2">
        </div>

    </div>

    <!-- OVERLAY IMAGE -->
    <img src="{{ url_for('static', filename='images/img3.png') }}"
         class="middle-image"
         alt="Middle Image">

</div>

<!-- GREEN BAR -->
<div class="green-bar d-flex justify-content-center align-items-center">
    <h2>Recommended by 9 out of 10 farmers nationally</h2>
</div>

<!-- TITLE IMAGE -->
<div class="container text-center mt-5">
    <img src="{{ url_for('static', filename='images/title.png') }}"
         class="title-image"
         alt="Title">
</div>

<!-- 4 IMAGE BUTTONS -->
<div class="container mt-4">
    <div class="row justify-content-between text-center button-row">

        <div class="col-3">
            <img src="{{ url_for('static', filename='images/fruit_title.png') }}" class="mini-title" alt="Fruit">
            <a href="{{ url_for('products', category='Fruit and Veg') }}">
                <img src="{{ url_for('static', filename='images/fruit.png') }}" class="category-btn" alt="Fruit">
            </a>
        </div>

        <div class="col-3">
            <img src="{{ url_for('static', filename='images/meat_title.png') }}" class="mini-title" alt="Meat">
            <a href="{{ url_for('products', category='Meat and Fish') }}">
                <img src="{{ url_for('static', filename='images/meat.png') }}" class="category-btn" alt="Meat">
            </a>
        </div>

        <div class="col-3">
            <img src="{{ url_for('static', filename='images/drinks_title.png') }}" class="mini-title" alt="Drinks">
            <a href="{{ url_for('products', category='Drink') }}">
                <img src="{{ url_for('static', filename='images/drinks.png') }}" class="category-btn" alt="Drinks">
            </a>
        </div>

        <div class="col-3">
            <img src="{{ url_for('static', filename='images/new_title.png') }}" class="mini-title" alt="New">
            <a href="{{ url_for('products', tags='New') }}">
                <img src="{{ url_for('static', filename='images/new.png') }}" class="category-btn" alt="New">
            </a>
        </div>

    </div>
</div>

{% endblock %}
