{% extends "base.html" %}

{% block content %}

<div class="container mt-5" style="max-width: 700px;">
    <h1 class="text-center mb-4">We Value Your Feedback</h1>

    <div class="card shadow-sm p-4">
        <form action="/feedback" method="POST">

            <div class="mb-3">
                <label class="form-label">Your Name</label>
                <input type="text" name="name" class="form-control" placeholder="Enter your name">
            </div>

            <div class="mb-3">
                <label class="form-label">Your Email</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email">
            </div>

            <div class="mb-3">
                <label class="form-label">How would you rate your experience?</label>
                <select name="rating" class="form-select">
                    <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                    <option value="4">⭐⭐⭐⭐ Very Good</option>
                    <option value="3">⭐⭐⭐ Good</option>
                    <option value="2">⭐⭐ Fair</option>
                    <option value="1">⭐ Poor</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Your Feedback</label>
                <textarea name="message" class="form-control" rows="4" placeholder="Tell us what you think..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">Submit Feedback</button>
        </form>
    </div>
</div>

{% endblock %}
